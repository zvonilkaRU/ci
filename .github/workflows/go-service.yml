name: Go Service CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "Service name (users, rooms, iam, servers)"
      go-version:
        required: false
        type: string
        default: "1.26"
        description: "Go version"
    secrets:
      GH_TOKEN:
        required: true
        description: "GitHub token with access to zvonilkaRU private repos"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: zvonilkaRU/${{ inputs.service }}
          token: ${{ secrets.GH_TOKEN }}
          path: ${{ inputs.service }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Configure git for private modules
        run: |
          git config --global url."https://git:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: github.com/zvonilkaRU,github.com/ilovepitsa

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ${{ inputs.service }}
          args: --timeout=5m
        env:
          GOPRIVATE: github.com/zvonilkaRU,github.com/ilovepitsa

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: zvonilkaRU/${{ inputs.service }}
          token: ${{ secrets.GH_TOKEN }}
          path: ${{ inputs.service }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Configure git for private modules
        run: |
          git config --global url."https://git:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: github.com/zvonilkaRU,github.com/ilovepitsa

      - name: Build
        working-directory: ${{ inputs.service }}
        run: go build ./...
        env:
          GOPRIVATE: github.com/zvonilkaRU,github.com/ilovepitsa

  # ci#16: govulncheck по графу вызовов — падает только на уязвимостях,
  # реально достижимых из кода сервиса (недостижимые выводит инфо-блоком).
  # Тулчейн резолвится свежим 1.26.x, поэтому stdlib-находки старых патчей
  # не флагаются.
  vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: zvonilkaRU/${{ inputs.service }}
          token: ${{ secrets.GH_TOKEN }}
          path: ${{ inputs.service }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Configure git for private modules
        run: |
          git config --global url."https://git:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: github.com/zvonilkaRU,github.com/ilovepitsa

      - name: govulncheck
        working-directory: ${{ inputs.service }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
        env:
          GOPRIVATE: github.com/zvonilkaRU,github.com/ilovepitsa
