name: Go Service CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "Service name (users, rooms, iam, servers)"
      go-version:
        required: false
        type: string
        default: "1.26"
        description: "Go version"
    secrets:
      GH_TOKEN:
        required: true
        description: "GitHub token with access to zvonilkaRU private repos"

# GOPRIVATE один для всех шагов всех джоб — задаём один раз на уровне
# workflow вместо отдельных копий в env каждого шага.
env:
  GOPRIVATE: github.com/zvonilkaRU,github.com/ilovepitsa

jobs:
  # ci#41: без явного timeout-minutes зависшая джоба висит дефолтные 6 ч.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Общие шаги всех джоб определены здесь YAML-якорями и переиспользуются
      # в build/vuln псевдонимами *checkout / *setup-go / *git-private-modules.
      - &checkout
        name: Checkout
        # ci#39: пин по SHA, комментарий — источник версии
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zvonilkaRU/${{ inputs.service }}
          token: ${{ secrets.GH_TOKEN }}
          path: ${{ inputs.service }}
      - &setup-go
        name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          # Сервис лежит в подкаталоге <service>/ — без явного пути кэш
          # модулей не найдёт go.sum и молча отключится.
          cache-dependency-path: ${{ inputs.service }}/go.sum
      - &git-private-modules
        name: Configure git for private modules
        run: |
          git config --global url."https://git:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.12.2
          working-directory: ${{ inputs.service }}
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-go
      - *git-private-modules
      - name: Build
        working-directory: ${{ inputs.service }}
        run: go build ./...

  # ci#16: govulncheck по графу вызовов — падает только на уязвимостях,
  # реально достижимых из кода сервиса (недостижимые выводит инфо-блоком).
  # Тулчейн резолвится свежим 1.26.x, поэтому stdlib-находки старых патчей
  # не флагаются.
  vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-go
      - *git-private-modules
      - name: govulncheck
        working-directory: ${{ inputs.service }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
