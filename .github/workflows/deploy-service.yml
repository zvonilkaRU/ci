name: Deploy Service

# Reusable deploy workflow for zvonilkaRU services (backend + frontend).
# Builds the service image (standalone Dockerfile; api-schema is fetched via
# `go mod download` since it is public), scans it with trivy (ci#16: an image
# with HIGH/CRITICAL vulns is NOT pushed), pushes to GHCR, then rolls the k8s
# Deployment forward — or rolls it back.
#
# Defaults match the backend layout (service module at repo root, namespace
# backend, manifests in k8s/base/backend/<service>) — backend callers pass
# only `service`. Non-standard services pass optional inputs:
#   namespace  — k8s namespace (frontend: frontend)
#   context    — build context dir inside the repo (frontend: app)
#   infra-dir  — dir under infra/k8s/base/ with the pin-able manifests
#   apply-dir  — kustomize dir (relative to infra/k8s/) to apply -k
#
# Triggers are owned by the CALLER (service repo deploy.yml): manual
# (workflow_dispatch) and/or tag push. This workflow is NEVER triggered
# automatically on push to main.
#
# Runs on a self-hosted runner registered on the target VPS (label: vps).
# The runner MUST have:
#   - docker
#   - kubectl
#   - kubeconfig at ~/.kube/zvonilka-vps.yaml (same file the infra Makefile uses)
# GHCR auth uses the caller's GITHUB_TOKEN (packages:write for its own package).
#
# GitOps (infra#40): при наличии секрета INFRA_DEPLOY_TOKEN (PAT с push в
# zvonilkaRU/infra; заводится repo-level в каждом сервисном репо и
# пробрасывается коллером) деплой пинит тег образа в манифестах infra,
# коммитит и применяет kubectl apply -k — git и кластер не расходятся.
# Без секрета работает прежний путь (kubectl set image). Rollback после
# rollout undo пинит в git фактический образ кластера.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "Service name (users, rooms, iam, servers, frontend); also the repo name, checkout path, deployment name and image name"
      namespace:
        required: false
        type: string
        default: "backend"
        description: "k8s namespace of the Deployment (frontend: frontend)"
      context:
        required: false
        type: string
        default: "."
        description: "Build context dir inside the repo checkout (frontend: app); default = repo root"
      infra-dir:
        required: false
        type: string
        default: ""
        description: "Dir under infra/k8s/base/ holding the pin-able manifests; empty = backend/<service>"
      apply-dir:
        required: false
        type: string
        default: ""
        description: "Kustomize dir to apply -k, relative to infra/k8s/; empty = base/backend/"
      image-tag:
        required: false
        type: string
        default: ""
        description: "Image tag to deploy; empty = short commit SHA"
      mode:
        required: false
        type: string
        default: "deploy"
        description: "deploy | rollback"
    secrets:
      GH_TOKEN:
        required: true
      # PAT с push в zvonilkaRU/infra (repo scope). Коллер пробрасывает
      # свой repo/org-секрет; пусто = legacy-путь (set image).
      INFRA_DEPLOY_TOKEN:
        required: false

jobs:
  deploy:
    name: ${{ inputs.mode == 'rollback' && 'Rollback' || 'Deploy' }} ${{ inputs.service }}
    runs-on: [self-hosted, vps]
    # ci#41: единственный vps-раннер — зависшая джоба держит слот до 6 ч.
    # build+scan+push+rollout укладываются в 30 мин с запасом.
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io/zvonilkaru
      SERVICE: ${{ inputs.service }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      NAMESPACE: ${{ inputs.namespace }}
      # Путь сборки внутри checkout: <repo>/<context> (context "." = корень).
      BUILD_DIR: ${{ inputs.service }}/${{ inputs.context }}
      INFRA_DIR: ${{ inputs.infra-dir || format('backend/{0}', inputs.service) }}
      APPLY_DIR: ${{ inputs.apply-dir || 'base/backend/' }}
      MODE: ${{ inputs.mode }}
      # PAT с push в zvonilkaRU/infra, проброшенный коллером. Пуст, пока
      # секрет не заведён — тогда работает legacy-путь (set image).
      INFRA_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
    steps:
      # ci#26: единый kubeconfig с infra-инструментами (Makefile, migrate.sh)
      # — на раннере может лежать и дефолтный ~/.kube/config.
      - name: Set kubeconfig path
        run: echo "KUBECONFIG=$HOME/.kube/zvonilka-vps.yaml" >> "$GITHUB_ENV"
      - name: Resolve image tag
        if: inputs.mode == 'deploy'
        run: |
          TAG="${IMAGE_TAG:-${GITHUB_SHA::12}}"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Deploying $SERVICE:$TAG"

      # ci#28: push тега не защищён branch protection — деплой может уйти
      # с коммита, не прошедшего CI. Гейт: у деплоящегося коммита (GITHUB_SHA
      # коллера) все check-runs завершены и зелёные. Ошибки API и «CI ещё
      # идёт» тоже блокируют деплой (fail closed) — перезапустить после
      # прохождения. Только python3 stdlib — без зависимости от jq/gh на
      # раннере. Токену коллера нужна permission checks: read (ci#29).
      - name: Verify CI passed
        if: inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.error, urllib.request

          svc, sha = os.environ["SERVICE"], os.environ["GITHUB_SHA"]
          tok = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/zvonilkaRU/{svc}/commits/{sha}/check-runs?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {tok}",
              "Accept": "application/vnd.github+json",
          })
          try:
              with urllib.request.urlopen(req) as r:
                  runs = json.load(r)["check_runs"]
          except urllib.error.HTTPError as e:
              sys.exit(f"CI gate: GitHub API {e.code} для {sha[:12]} — fail closed")

          if not runs:
              sys.exit(f"CI gate: у коммита {sha[:12]} нет прогонов CI — деплой запрещён")
          pending = [x["name"] for x in runs if x["status"] != "completed"]
          if pending:
              sys.exit(f"CI gate: CI ещё идёт ({', '.join(pending)}) — перезапусти деплой после завершения")
          bad = [f'{x["name"]}: {x["conclusion"]}' for x in runs if x["conclusion"] != "success"]
          if bad:
              sys.exit(f"CI gate: не все проверки зелёные — {', '.join(bad)}")
          print(f"CI gate: {len(runs)} проверок коммита {sha[:12]} — все success")
          EOF

      - name: Checkout service
        if: inputs.mode == 'deploy'
        # ci#39: пин по SHA — мутабельный тег экшена можно переписать в апстриме
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zvonilkaRU/${{ env.SERVICE }}
          token: ${{ secrets.GH_TOKEN }}
          path: ${{ env.SERVICE }}

      # ci#27: накат миграций выполняет сам сервис при старте пода
      # (embed + goose, ci#1) — в пайплайне дублировать нечего. Гейт
      # консистентности файлов ловит класс регрессии TASKS#8 (дубликаты
      # версий goose) ДО сборки и пуша образа: такой релис иначе падает
      # crash-loop'ом уже после раскатки. Нет каталога migrations (iam,
      # frontend) — шаг молча пропускается.
      - name: Verify migrations consistent
        if: inputs.mode == 'deploy'
        run: |
          MIGRATIONS_DIR="$BUILD_DIR/migrations"
          if [ ! -d "$MIGRATIONS_DIR" ]; then
            echo "migrations/ не найден — $SERVICE без собственной схемы БД, пропуск"
            exit 0
          fi
          MIGRATIONS_DIR="$MIGRATIONS_DIR" python3 - <<'EOF'
          import os, re, sys

          mig_dir = os.environ["MIGRATIONS_DIR"]
          ups = {}
          for name in sorted(os.listdir(mig_dir)):
              if name.endswith(".down.sql"):
                  continue
              m = re.match(r"^(\d+)_.+\.sql$", name)
              if not m:
                  sys.exit(f"migrations: некорректное имя файла: {name} (ожидается NNN_name.sql)")
              version = int(m.group(1))
              if version in ups:
                  sys.exit(f"migrations: дубликат версии {version}: {ups[version]} и {name}")
              ups[version] = name
          if not ups:
              sys.exit("migrations: каталог пуст — ожидается хотя бы одна миграция")
          versions = sorted(ups)
          print(f"migrations: файлов: {len(versions)}, версии {versions[0]:03d}..{versions[-1]:03d} — консистентно")
          EOF

      - name: Build image
        if: inputs.mode == 'deploy'
        run: |
          IMAGE="$REGISTRY/$SERVICE:$IMAGE_TAG"
          # ci#36: --pull — сверяться с реестром за свежим базовым образом,
          # а не брать протухший слой из кэша раннера (иначе патчи alpine/nginx
          # не попадают в сборку, и trivy-гейт ci#16 блокирует деплой).
          docker build --pull -f "$BUILD_DIR/Dockerfile" -t "$IMAGE" "$BUILD_DIR"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # ci#16: уязвимый образ не публикуется — trivy-скан ДО docker push,
      # гейт по HIGH/CRITICAL. trivy запускается контейнером через docker.sock
      # (на раннере ничего не ставим); БД уязвимостей (~112 МБ) кэшируется в
      # ~/.cache/trivy раннера и авто-обновляется. --ignore-unfixed — безфиксовые
      # CVE не блокируют деплой: пути лечения нет, был бы только вечный стопор.
      - name: Scan image (trivy)
        if: inputs.mode == 'deploy'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            # ci#39: docker.sock монтируется стороннему образу — только digest-пин;
            # обновление версии = осознанный коммит нового digest
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE"

      - name: Push image
        if: inputs.mode == 'deploy'
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Legacy-путь, пока org-секрета нет (или для сравнения поведения).
      - name: Rollout deploy (legacy set image)
        if: inputs.mode == 'deploy' && env.INFRA_TOKEN == ''
        run: |
          # set image updates the container image; rollout restart forces a new
          # ReplicaSet even when the image tag is unchanged (re-deploy on the
          # same tag / re-run of the workflow just re-rolls, no questions asked).
          kubectl set image "deployment/$SERVICE" "$SERVICE=$IMAGE" -n "$NAMESPACE"
          kubectl rollout restart "deployment/$SERVICE" -n "$NAMESPACE"
          kubectl rollout status "deployment/$SERVICE" -n "$NAMESPACE" --timeout=180s

      - name: Rollback
        if: inputs.mode == 'rollback'
        run: |
          kubectl rollout undo "deployment/$SERVICE" -n "$NAMESPACE"
          kubectl rollout status "deployment/$SERVICE" -n "$NAMESPACE" --timeout=180s

      # ── GitOps (infra#40): общая ветка deploy/rollback ──
      # Шаги ниже идут ПОСЛЕ Rollback, чтобы при откате пинить уже
      # откаченный образ; в deploy-режиме пропущенные шаги ничего не меняют.
      - name: Checkout infra
        if: env.INFRA_TOKEN != '' && (inputs.mode == 'deploy' || inputs.mode == 'rollback')
        # ci#39: пин по SHA — мутабельный тег экшена можно переписать в апстриме
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zvonilkaRU/infra
          token: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          path: infra

      # GitOps (infra#40): пиним тег в git ДО касания кластера. Пуш не прошёл —
      # кластер не тронут, деплой упал честно. При rollback в git пинится
      # фактический образ кластера после undo — иначе откат опять разводит
      # git и live.
      - name: Pin image in infra
        if: env.INFRA_TOKEN != '' && (inputs.mode == 'deploy' || inputs.mode == 'rollback')
        run: |
          if [ "$MODE" = "rollback" ]; then
            IMAGE=$(kubectl get deployment "$SERVICE" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}')
            TAG="${IMAGE##*:}"
          else
            TAG="$IMAGE_TAG"
          fi
          GLOB="infra/k8s/base/$INFRA_DIR"
          sed -i "s#image: $REGISTRY/$SERVICE:[^ ]*#image: $REGISTRY/$SERVICE:$TAG#" $GLOB/*.yaml
          grep -q "$REGISTRY/$SERVICE:$TAG" $GLOB/*.yaml
          cd infra
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add k8s
          # ci#40: различаем «нечего коммитить» явно; прочие ошибки коммита
          # (index.lock, права, диск) падают громко. Иначе sed уже поменял
          # рабочее дерево, git push молча уходит up-to-date, а kubectl apply
          # ниже раскатывает образ, которого нет в git — тихий дрейф петли.
          if git diff --cached --quiet; then
            # Повторный деплой того же тега: пин уже в git, коммитить нечего —
            # не падаем, apply + rollout restart ниже честно перераскатят.
            echo "infra already pins $SERVICE at $TAG"
          else
            git commit -m "chore($MODE): $SERVICE -> $TAG [skip ci]"
            git push
          fi

      # Применяем запиненное из git. rollout restart forces a new ReplicaSet
      # even when the image tag is unchanged (re-deploy on the same tag /
      # re-run just re-rolls).
      - name: Apply infra & rollout
        if: inputs.mode == 'deploy' && env.INFRA_TOKEN != ''
        run: |
          kubectl apply -k "infra/k8s/$APPLY_DIR"
          kubectl rollout restart "deployment/$SERVICE" -n "$NAMESPACE"
          kubectl rollout status "deployment/$SERVICE" -n "$NAMESPACE" --timeout=180s
